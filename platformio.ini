[platformio]
default_envs = bringup
workspace_dir = .opencode-tmp/pio-workspace
test_dir = tests

[env:bringup]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    platformio/tool-esptoolpy@2.40900.250804
    espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5
    espressif/toolchain-riscv32-esp@8.4.0+2021r2-patch5
; Matches the partition table read from this board before flashing.
board_build.partitions = default_16MB.csv
board_build.flash_mode = dio
; Arduino 2.0.17's bundled S3 DIO bootloader is supplied at 80 MHz, not 40 MHz.
board_build.f_flash = 80000000L
board_build.arduino.memory_type = dio_qspi
; esptool verified 16 MB quad flash on 2026-11-05. PSRAM intentionally off.
; Preserve the existing two 0x640000-byte OTA slots and filesystem locations.
board_upload.flash_size = 16MB
; Leave upload_protocol unset: the platform defaults to esptool. Explicitly
; setting it in platform 6.12.0 unnecessarily auto-selects OpenOCD as a package.
upload_speed = 115200
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -Wall
    -Wextra
    -std=gnu++17
    -DESP_NN
    -DCONFIG_NN_OPTIMIZED
    -DARCH_ESP32_S3
lib_deps =
    nickjgniklu/ESP_TF@2.1.1
lib_ldf_mode = chain+
